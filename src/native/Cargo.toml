# Bluestone-owned native code (ADR 0026: C# first; Rust where a measurement or a native ABI requires it).
# Each crate is a cdylib with a small, versioned C ABI, built by `dotnet build` through src/Native.targets.
[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
license = "MIT"
publish = false

[profile.release]
debug = "line-tables-only"
panic = "abort"

[profile.dev]
panic = "abort"
