name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    name: Build and test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      # cpal's ALSA backend links libasound.
      - name: Install ALSA development files
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev

      # Rust is preinstalled on the hosted runners; print the versions so a missing toolchain fails here.
      - name: Rust toolchain
        run: |
          cargo --version
          rustc --version

      - name: Test native crates
        working-directory: native
        run: cargo test --locked

      - name: Check native formatting and lints
        if: matrix.os == 'ubuntu-latest'
        working-directory: native
        run: |
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings

      - name: Restore
        run: dotnet restore src/Bluestone.slnx

      - name: Build
        run: dotnet build src/Bluestone.slnx --no-restore --configuration Release

      # CoreMIDI on hosted macOS runners is unreliable (the MIDI server may not start and virtual
      # ports can time out), so those tests run only on developer machines.
      - name: Test
        run: dotnet test src/Bluestone.slnx --no-build --configuration Release --filter-not-class Bluestone.Tests.Integration.Platform.CoreMidiProviderTests

      - name: Check formatting
        if: matrix.os == 'ubuntu-latest'
        run: dotnet format src/Bluestone.slnx --no-restore --verify-no-changes
