name: CI

# Pull requests only: main is protected and takes changes only through pull requests that pass these checks, so the
# merged commit is not tested again. Run it by hand (workflow_dispatch) to check main.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    name: Build and test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      # cpal's ALSA backend links libasound.
      - name: Install ALSA development files
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev

      # Rust is preinstalled on the hosted runners; print the versions so a missing toolchain fails here.
      - name: Rust toolchain
        run: |
          cargo --version
          rustc --version

      - name: Test native crates
        working-directory: src/native
        run: cargo test --locked

      - name: Check native formatting and lints
        if: matrix.os == 'ubuntu-latest'
        working-directory: src/native
        run: |
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings

      - name: Restore
        run: dotnet restore src/dotnet/Bluestone.slnx

      - name: Build
        run: dotnet build src/dotnet/Bluestone.slnx --no-restore --configuration Release

      # One test assembly at a time: the integration tests measure real-time delivery, which the other assemblies'
      # work would make late on the few cores of a hosted runner.
      # CoreMIDI on hosted macOS runners is unreliable (the MIDI server may not start and virtual
      # ports can time out), so those tests run only on developer machines.
      - name: Test
        run: dotnet test src/dotnet/Bluestone.slnx --no-build --configuration Release --max-parallel-test-modules 1 --filter-not-class Bluestone.Tests.Integration.Platform.CoreMidiProviderTests

      - name: Check formatting
        if: matrix.os == 'ubuntu-latest'
        run: dotnet format src/dotnet/Bluestone.slnx --no-restore --verify-no-changes
