name: Version

# Tags every commit that lands on main with the next version, and builds and publishes a GitHub Release when asked.
# Independent of CI: it does not wait for or gate on the CI checks, and adds none of its own.
#
# Release builds do not run the tests again; the required pull request checks already did.
#
# Tokens in the message of the commit that landed (for a merge commit that includes the PR title; case-insensitive):
#   (none)                         patch: v0.3.7 -> v0.3.8
#   [minor]                        v0.3.7 -> v0.4.0
#   [major]                        v0.3.7 -> v1.0.0
#   [skip version]                 no tag
#   [release]                      also build every platform and publish a release
#   [pre-release] / [prerelease]   the same, marked as a pre-release
# [skip version] with a release token re-releases the latest tag. See CONTRIBUTING.md and .github/scripts/.
# Each run tags every untagged commit on main since the latest tag, oldest first, so none is missed.
#
# Tags and releases made with GITHUB_TOKEN start no other workflow, so this cannot loop or start CI.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build and release (e.g. v0.4.0)
        required: true
        type: string
      kind:
        description: Kind of release
        required: true
        type: choice
        options: [prerelease, release]
        default: prerelease

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  tag:
    name: Tag the next version
    runs-on: ubuntu-latest
    # Only tagging runs one at a time (it takes seconds), so two merges never compute the same version. A run GitHub
    # replaces while waiting loses nothing: the next run tags every untagged commit since the latest tag.
    concurrency:
      group: version-tag
      cancel-in-progress: false
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.decide.outputs.tag }}
      release: ${{ steps.decide.outputs.release }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Decide
        id: decide
        env:
          EVENT: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_KIND: ${{ inputs.kind }}
        run: |
          set -euo pipefail

          if [[ "$EVENT" == "workflow_dispatch" ]]; then
            if ! git rev-parse -q --verify "refs/tags/$INPUT_TAG" >/dev/null; then
              echo "::error::Tag $INPUT_TAG does not exist."
              exit 1
            fi
            echo "tag=$INPUT_TAG" >> "$GITHUB_OUTPUT"
            echo "release=$INPUT_KIND" >> "$GITHUB_OUTPUT"
            echo "Releasing existing tag **$INPUT_TAG** ($INPUT_KIND), started by hand." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          result="$(.github/scripts/tag-commits.sh "$GITHUB_SHA")"
          tags="$(sed -n 's/^tags=//p' <<<"$result")"
          release_tag="$(sed -n 's/^release_tag=//p' <<<"$result")"
          release="$(sed -n 's/^release=//p' <<<"$result")"

          if [[ -n "$tags" ]]; then
            read -r -a list <<<"$tags"
            git push origin "${list[@]/#/refs/tags/}"
            echo "Tagged **$tags**." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No new tag (already tagged, or [skip version])." >> "$GITHUB_STEP_SUMMARY"
          fi

          {
            echo "tag=$release_tag"
            echo "release=$release"
          } >> "$GITHUB_OUTPUT"
          if [[ "$release" != "none" ]]; then
            echo "Releasing **$release_tag** ($release)." >> "$GITHUB_STEP_SUMMARY"
          fi

  build:
    name: Build ${{ matrix.rid }}
    needs: tag
    if: needs.tag.outputs.release == 'release' || needs.tag.outputs.release == 'prerelease'
    strategy:
      fail-fast: true
      matrix:
        include:
          - { rid: osx-arm64, os: macos-latest, archive: zip }
          - { rid: osx-x64, os: macos-15-intel, archive: zip }
          - { rid: win-x64, os: windows-latest, archive: zip }
          - { rid: win-arm64, os: windows-11-arm, archive: zip }
          - { rid: linux-x64, os: ubuntu-latest, archive: tar.gz }
          - { rid: linux-arm64, os: ubuntu-24.04-arm, archive: tar.gz }
    runs-on: ${{ matrix.os }}
    env:
      TAG: ${{ needs.tag.outputs.tag }}
    steps:
      # The tag's own history, so the build finds the tag and stamps that version.
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ needs.tag.outputs.tag }}
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      # cpal's ALSA backend links libasound.
      - name: Install ALSA development files
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev

      # No tests here: the commit already passed the required CI checks to reach main. The publish builds what it needs
      # (the Rust libraries too) and is self-contained: .NET, the Rust libraries, the profiles, and the plugin worker.
      - name: Publish
        run: dotnet publish src/dotnet/Bluestone.Desktop --configuration Release --runtime ${{ matrix.rid }} --self-contained --output publish/Bluestone

      # The engine process ships as NativeAOT (ADR 0044): published over the JIT engine the app's publish copied, so the
      # launcher finds the native executable beside Bluestone.
      - name: Publish the engine ahead of time
        run: dotnet publish src/dotnet/Bluestone.Engine --configuration Release --runtime ${{ matrix.rid }} --output publish/Bluestone

      - name: Package (zip, macOS)
        if: runner.os == 'macOS'
        working-directory: publish
        run: ditto -c -k --keepParent Bluestone "Bluestone-$TAG-${{ matrix.rid }}.zip"

      - name: Package (zip, Windows)
        if: runner.os == 'Windows'
        working-directory: publish
        shell: pwsh
        run: Compress-Archive -Path Bluestone -DestinationPath "Bluestone-$env:TAG-${{ matrix.rid }}.zip"

      - name: Package (tar.gz, Linux)
        if: runner.os == 'Linux'
        working-directory: publish
        run: tar -czf "Bluestone-$TAG-${{ matrix.rid }}.tar.gz" Bluestone

      - uses: actions/upload-artifact@v7
        with:
          name: Bluestone-${{ matrix.rid }}
          path: publish/Bluestone-${{ needs.tag.outputs.tag }}-${{ matrix.rid }}.${{ matrix.archive }}
          if-no-files-found: error
          retention-days: 7

  notes:
    name: Generate release notes
    needs: tag
    if: needs.tag.outputs.release == 'release' || needs.tag.outputs.release == 'prerelease'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      copilot-requests: write
    outputs:
      existing: ${{ steps.prepare.outputs.existing }}
    env:
      TAG: ${{ needs.tag.outputs.tag }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      # Helpers belong to the workflow revision, even when rebuilding an older release tag.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Test release notes helpers
        run: python3 .github/scripts/release-notes.test.py

      - name: Collect the complete release history
        id: prepare
        run: |
          echo "NOTES_DIR=$RUNNER_TEMP/release-notes" >> "$GITHUB_ENV"
          python3 .github/scripts/release-notes.py prepare "$TAG" --directory "$RUNNER_TEMP/release-notes"

      - name: Set up Node for Copilot
        id: node
        if: steps.prepare.outputs.summarize == 'true' && vars.RELEASE_NOTES_AI != 'false'
        continue-on-error: true
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Write the release narrative with Copilot
        id: copilot
        if: steps.node.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 5
        env:
          COPILOT_GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          npm install --global @github/copilot
          copilot -s --no-ask-user --model auto --disable-builtin-mcps \
            --deny-tool shell --deny-tool write --deny-tool url \
            < "$NOTES_DIR/prompt.txt" > "$NOTES_DIR/summary.json"

      - name: Assemble and validate the notes
        if: steps.prepare.outputs.existing == 'false'
        run: python3 .github/scripts/release-notes.py compose --directory "$NOTES_DIR"

      - uses: actions/upload-artifact@v7
        if: steps.prepare.outputs.existing == 'false'
        with:
          name: release-notes-${{ needs.tag.outputs.tag }}
          path: ${{ runner.temp }}/release-notes/release-notes.md
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish the release
    needs: [tag, build, notes]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ needs.tag.outputs.tag }}
      KIND: ${{ needs.tag.outputs.release }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      EXISTING: ${{ needs.notes.outputs.existing }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: Bluestone-*
          merge-multiple: true
          path: dist

      - uses: actions/download-artifact@v8
        if: needs.notes.outputs.existing == 'false'
        with:
          name: release-notes-${{ needs.tag.outputs.tag }}
          path: notes

      - name: Create or update the release
        run: |
          set -euo pipefail
          ls -l dist
          if [[ "$EXISTING" == "true" ]]; then
            gh release upload "$TAG" dist/* --clobber
            if [[ "$KIND" == "prerelease" ]]; then
              gh release edit "$TAG" --prerelease=true
            else
              gh release edit "$TAG" --prerelease=false
            fi
            echo "Updated release **$TAG** ($KIND) with new files." >> "$GITHUB_STEP_SUMMARY"
          elif [[ "$EXISTING" == "false" ]]; then
            flags=(--title "Bluestone $TAG" --notes-file notes/release-notes.md --verify-tag)
            if [[ "$KIND" == "prerelease" ]]; then
              flags+=(--prerelease)
            fi
            gh release create "$TAG" "${flags[@]}" dist/*
            echo "Published **$TAG** ($KIND)." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::error::Release notes did not establish whether $TAG already exists."
            exit 1
          fi
