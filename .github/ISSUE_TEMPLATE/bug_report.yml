name: Bug report
description: Something in Bluestone does not work as expected.
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the problem and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Attach a `.bluestone` or `.mid` file if it helps, as long as you may share it.
      placeholder: |
        1. Open ...
        2. Route track 1 to ...
        3. Press Play
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      multiple: true
      options:
        - Arrangement, piano roll, or event list
        - Recording or MIDI thru
        - MIDI input or output
        - Device profiles
        - Tracks, devices, racks, or routing
        - Audio engine or mixer
        - Plugins (scanning, hosting, editors)
        - Project or MIDI files
        - User interface or accessibility
        - Other
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS
        - Windows
        - Linux
    validations:
      required: true
  - type: input
    id: os-version
    attributes:
      label: OS version and CPU architecture
      placeholder: macOS 26.1, Apple silicon
  - type: input
    id: commit
    attributes:
      label: Bluestone version or commit
      placeholder: 822d257
  - type: textarea
    id: setup
    attributes:
      label: MIDI, audio, and plugin setup
      description: Device profile, MIDI endpoint, and hardware or software instrument involved; the audio device and settings; plugins (name, format, version) and hosting mode.
      placeholder: |
        Generic XG profile -> physical QY100 over USB MIDI interface
        Audio: built-in output, 48 kHz, buffer 256
        Surge XT 1.3.4 (CLAP), hosted by plugin
  - type: textarea
    id: logs
    attributes:
      label: Logs, MIDI monitor or Messages output, or screenshots
      render: text
